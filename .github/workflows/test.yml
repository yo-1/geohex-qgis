name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test:
    # QGIS 非依存部分（geohex_v3 / cell_selector）のみを対象にする。
    # QGIS 依存部分（algorithm.py など）は現状 CI 未対応。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
